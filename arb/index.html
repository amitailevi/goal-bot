  const WARMUP = 90e3;
  const PLAY = new Set(['1H', 'HT', '2H', 'ET', 'ET1', 'ET2', '1ET', '2ET', 'BT', 'ETHT', 'PEN']);
  const MIN_NET = 0.5;           // ¢ per share after fees — below this the deal is skipped
  const COOLDOWN = 10 * 60e3;    // at most one alert per game every 10 minutes
  const GRACE = 30e3;            // a closed opportunity stays on screen for 30 seconds
  const BOOK_FRESH = 30e3;
  const DEF_FEE = { rate: 0.05, exp: 1 }; // Polymarket sports taker fee: C × 0.05 × p × (1 − p)

  const OLD = window.__arb;
  if (OLD && OLD.stop) { try { OLD.stop(); } catch (e) {} }
  const SS_KEY = 'arb';
  const saved = (() => { try { return JSON.parse(sessionStorage.getItem(SS_KEY) || 'null') || {}; } catch (e) { return {}; } })();
  const prefs = (() => { try { return JSON.parse(localStorage.getItem('arbprefs') || 'null') || {}; } catch (e) { return {}; } })();
  const fresh = t => Date.now() - t < 6 * 3600e3;

  const S = window.__arb = {
    gap: +prefs.gap || 2, minFrom: prefs.minFrom != null ? +prefs.minFrom : 60, maxCost: +prefs.maxCost || 96, budget: +prefs.budget || 100,
    muted: !!prefs.muted, demo: false,
    games: new Map(), soccer: null, leagueName: {}, leagueImg: {},
    alerts: (saved.alerts || []).filter(a => a && fresh(a.t)), alertedIds: saved.alertedIds || {},
    ws: null, wsState: 'connecting', lastMsg: 0, backoff: 1000, closedAt: 0,
    mws: null, mwsState: 'idle', mBackoff: 1000, mInit: false, mLastAny: 0,
    subs: new Set(), books: new Map(), tokGame: new Map(), pend: new Set(), dirty: new Set(), rafPending: false,

    timers: [], stopped: false, snapState: 'idle', lastSnap: 0, renderPending: false, trapArmed: false, showLog: false,
  };
  for (const k of Object.keys(S.alertedIds)) if (!fresh(S.alertedIds[k])) delete S.alertedIds[k];
  S.stop = () => {
    S.stopped = true;
    S.timers.forEach(clearInterval);
    if (S.flashTimer) clearInterval(S.flashTimer);
    if (S.mPing) clearInterval(S.mPing);
    if (S.onPop) window.removeEventListener('popstate', S.onPop);
    try { S.ws && S.ws.close(); } catch (e) {}
    try { S.mws && S.mws.close(); } catch (e) {}
  };
  const persist = () => {
    try { sessionStorage.setItem(SS_KEY, JSON.stringify({ alerts: S.alerts.slice(0, 50), alertedIds: S.alertedIds })); } catch (e) {}
    try { localStorage.setItem('arbprefs', JSON.stringify({ gap: S.gap, minFrom: S.minFrom, maxCost: S.maxCost, budget: S.budget, muted: S.muted })); } catch (e) {}
  };

    S.rafPending = false;

    for (const id of S.dirty) { const g = S.games.get(id); if (!g) continue; if (evalOpp(g)) moved = true; paint(g); }
    S.dirty.clear();
    if (moved) scheduleRender();
  }
  function tick(el, dir) {
    if (!el || !dir) return;
    el.classList.remove('tick-up', 'tick-dn');
    void el.offsetWidth;
    el.classList.add(dir > 0 ? 'tick-up' : 'tick-dn');
  }
  function paint(g) {
    const r = g.calc;
    const card = document.querySelector(`#opps .card[data-g="${g.id}"]`);
    if (card) {
      const box = card.querySelector('.calc'), html = calcHTML(g);
      if (box && box.dataset.h !== html) {
        box.innerHTML = html; box.dataset.h = html;
        if (r && r.ready && g.shownSum != null) tick(box.querySelector('.sum'), r.sum < g.shownSum - 1e-9 ? 1 : r.sum > g.shownSum + 1e-9 ? -1 : 0);
      }
      const st = card.querySelector('.st');
      if (st) { const t = statusTxt(g); if (st.textContent !== t) st.textContent = t; st.className = 'st' + (g.oppOn ? ' open' : ''); }
      card.classList.toggle('closed', !g.oppOn);
    }
    const row = document.querySelector(`#watch .row[data-g="${g.id}"]`);
    if (row) {
      const pc = row.querySelector('.pc'), t = r && r.ready ? c1(r.sum) : '';
      if (pc && pc.textContent !== t) { pc.textContent = t; if (r && r.ready && g.shownSum != null) tick(pc, r.sum < g.shownSum - 1e-9 ? 1 : r.sum > g.shownSum + 1e-9 ? -1 : 0); }
      const why = row.querySelector('.why'), w = whyHTML(g);
      if (why && why.dataset.h !== w) { why.innerHTML = w; why.dataset.h = w; }
    }
    if (r && r.ready) g.shownSum = r.sum;
  }

  /* ---------- render ---------- */
  const statusTxt = g => g.demo ? '🧪 דוגמה' : g.oppOn ? '● פתוחה עכשיו' : `נסגרה ${secsAgo(g.oppEnd)}`;
  function calcHTML(g) {
    const r = g.calc, ln = esc(leaderName(g)), tn = esc(trailerName(g));
    if (!r) return '';
    if (!r.ready) return `<div class="wait">${r.noMkts === 'nodraw' ? 'אין שוק תיקו למשחק הזה' : 'טוען מחירים מספר הפקודות…'}</div>`;
    const sz = (s, need) => s >= need ? `${shares(s)} מניות` : `<span class="bad">${shares(s)} מניות · צריך ${shares(need)}</span>`;
    const lsCls = (s, need) => 'ls' + (s >= need ? '' : ' bad');
    const legs = `<div class="legs">` +
      `<div class="leg"><span class="lk">מובילה · <b>${ln}</b></span><span class="lp">${c1(r.a.p)}</span><span class="${lsCls(r.a.s, r.shares)}">${sz(r.a.s, r.shares)}</span></div>` +
      `<div class="leg"><span class="lk">תיקו</span><span class="lp">${c1(r.d.p)}</span><span class="${lsCls(r.d.s, r.shares)}">${sz(r.d.s, r.shares)}</span></div>` +
      `<div class="leg tot${r.priceOK ? ' ok' : ''}"><span class="lk">סך עלות</span><span class="lp sum">${c1(r.sum)}</span><span class="ls">+ עמלות ${c2(r.fee)}</span></div></div>`;
    const money = r.net > 0
      ? `<div class="money"><div class="win${r.opp ? '' : ' off'}">השקעה ${ltr(usd0(S.budget))} | רווח נקי ${ltr(usd(r.profit))} <span class="m">(${shares(r.shares)} זוגות מניות · אם ${ln} מנצחת או תיקו)</span></div>` +
        `<div class="risk">אם <b>${tn}</b> מנצחת: ${ltr('−' + usd(r.loss))}</div></div>`
      : `<div class="money"><div class="win off">אין רווח: העלות עם העמלות מעל $1 לזוג</div></div>`;
    let alt = '';
    if (r.alt && r.n) {
      const best = r.altBetter;
      alt = `<div class="alt${best && r.altOpp ? ' best' : ''}">${best ? 'זול יותר' : 'אפשר גם'} בקנייה אחת: "לא" על <b>${tn}</b> ב-${ltr(c1(r.n.p))}` +
        (best && r.altNet > 0 ? ` · רווח נקי ${ltr(usd(r.altProfit))}` : '') + (r.n.s < r.altShares ? ` · <span class="bad">חסרה נזילות</span>` : '') + `</div>`;
    }
    return legs + money + alt;
  }
  const tr = (g, side, goals, lead) => `<div class="tr${lead ? ' lead' : ''}"><span class="tn">${teamLogo(g, side, 24)}<span class="nm">${esc(nm(g, side))}</span></span><span class="gl">${goals}</span></div>`;
  function cardHTML(g) {
    const leadHome = g.h > g.a;
    const isNew = g.flashUntil && Date.now() < g.flashUntil;
    const html = calcHTML(g);
    const cls = 'card' + (g.demo ? ' demo' : '') + (!g.oppOn && !g.demo ? ' closed' : '') + (isNew ? ' new' : '');
    const head = `<div class="meta"><span class="lgw">${g.demo ? '<span class="badge demo">דמו</span>' : ''}${leagueChips(g, false)}</span><span class="min">${esc(minuteTxt(g))}</span></div><div class="lgn">${esc(leagueTxt(g))}</div>`;
    const body = `<div class="board">${tr(g, 'h', g.h, leadHome)}${tr(g, 'a', g.a, !leadHome)}</div><div class="calc" data-h="${esc(html)}">${html}</div>`;
    const foot = `<div class="foot"><span class="st${g.oppOn ? ' open' : ''}">${esc(statusTxt(g))}</span><span class="go">${g.demo ? 'דוגמה בלבד' : 'פתח בפולימרקט ↗'}</span></div>`;
    if (g.calc && g.calc.ready) g.shownSum = g.calc.sum;
    return g.demo
      ? `<div class="${cls}" data-g="${g.id}">${head}${body}${foot}</div>`
      : `<a class="${cls}" data-g="${g.id}" href="${esc(link(g))}" target="_blank" rel="noopener">${head}${body}${foot}</a>`;
  }
  const cardKey = g => [g.h, g.a, minuteTxt(g), g.alertAt || 0, (g.flashUntil && Date.now() < g.flashUntil) ? 1 : 0, nm(g, 'h'), nm(g, 'a'), leagueTxt(g),
    g.slug || '', g.homeLogo || '', g.awayLogo || '', S.leagueImg[g.league] ? 1 : 0, g.demo ? 1 : 0, g.oppOn ? 1 : 0].join('|');
  function whyHTML(g) {
    if (waiting(g)) return `<span class="badge wt">⏳ דקה ${S.minFrom}</span>`;
    const r = g.calc;
    if (!r || !r.ready) return `<span class="badge no">${r && r.noMkts === 'nodraw' ? 'אין שוק תיקו' : 'טוען מחיר'}</span>`;
    const k = reason(r);
    if (k === 'ok') return '<span class="badge ok">✅ הזדמנות</span>';
    if (k === 'price') return `<span class="badge no">יקר ב-${c1(r.sum - S.maxCost / 100)}</span>`;
    if (k === 'liq') return '<span class="badge bad">חסרה נזילות</span>';
    if (k === 'net') return '<span class="badge no">רווח קטן מדי</span>';
    return '';
  }
  function rowHTML(g) {
    const leadHome = g.h > g.a, r = g.calc;
    const w = whyHTML(g);
    if (r && r.ready) g.shownSum = r.sum;
    return `<a class="row" data-g="${g.id}" href="${esc(link(g))}" target="_blank" rel="noopener"><span class="min">${esc(shortMin(g))}</span>` +
      `<span class="teams">${teamLogo(g, 'h', 18)}<span class="tnm ${leadHome ? 'ld' : ''}">${esc(nm(g, 'h'))}</span><b>${g.h}–${g.a}</b><span class="tnm ${leadHome ? '' : 'ld'}">${esc(nm(g, 'a'))}</span>${teamLogo(g, 'a', 18)}</span>` +
      `<span class="pc" title="מובילה + תיקו (מחירי קנייה עכשיו)">${r && r.ready ? c1(r.sum) : ''}</span><span class="lgc"><span class="why" data-h="${esc(w)}">${w}</span>${leagueChips(g, true)}</span></a>`;
  }
  const rowKey = g => [waiting(g) ? 'w' + S.minFrom : '', g.h, g.a, shortMin(g), nm(g, 'h'), nm(g, 'a'), leagueTxt(g), g.slug || '', g.homeLogo || '', g.awayLogo || '', S.leagueImg[g.league] ? 1 : 0].join('|');
  // update a list in place: only changed items are rebuilt, so live prices and animations keep running smoothly
  function patch(box, items, keyOf, htmlOf, emptyHTML) {
    if (!items.length) { if (box.dataset.empty !== emptyHTML) { box.innerHTML = emptyHTML; box.dataset.empty = emptyHTML; } return; }
    delete box.dataset.empty;
    const cur = [...box.children].filter(c => c.dataset && c.dataset.g);
    const make = g => { const t = document.createElement('template'); t.innerHTML = htmlOf(g).trim(); const el = t.content.firstElementChild; el.dataset.k = keyOf(g); return el; };
    const same = cur.length === box.children.length && cur.length === items.length && items.every((g, i) => cur[i].dataset.g === String(g.id));
    if (same) { items.forEach((g, i) => { if (cur[i].dataset.k !== keyOf(g)) cur[i].replaceWith(make(g)); }); return; }
    const byId = new Map(cur.map(c => [c.dataset.g, c]));
    const frag = document.createDocumentFragment();
    for (const g of items) { const old = byId.get(String(g.id)); frag.appendChild(old && old.dataset.k === keyOf(g) ? old : make(g)); }
    box.replaceChildren(frag);
  }
  function renderTools() {
    const scoresOk = S.wsState === 'open' && Date.now() - S.lastMsg < 20e3;
    const pricesOk = S.mwsState === 'open' && Date.now() - S.mLastAny < 25e3;
    const lp = $('live'), lt = $('liveTx');
    if (lp && lt) {
      lp.className = 'livepill' + (scoresOk && pricesOk ? ' ok' : (S.wsState === 'closed' ? ' bad' : ''));
      lt.textContent = scoresOk && pricesOk ? 'חי' : S.wsState === 'closed' ? 'מנותק · מתחבר…' : scoresOk ? 'מחירים מתעכבים' : 'מתחבר…';
      lp.title = `תוצאות: ${scoresOk ? 'חי' : 'מתחבר'} · מחירים: ${pricesOk ? 'חי' : 'מתחבר'}`;
    }
    const snd = $('snd');
    if (snd) {
      const on = S.soundOn && audioOk() && !S.muted;
      snd.textContent = on ? '🔔' : '🔕';
      snd.title = on ? 'הצליל פועל · לחץ להשתקה' : 'הצליל כבוי · לחץ להפעלה';
    }
    const cta = $('cta');
    if (cta) {
      if (!S.soundOn || !audioOk()) { cta.hidden = false; cta.className = 'cta'; cta.textContent = (CAN_NOTIFY && Notification.permission === 'default') ? '🔔 לחץ כאן כדי להפעיל צליל והתראות' : '🔔 לחץ פעם אחת כדי להפעיל את הצליל'; }
      else if (CAN_NOTIFY && Notification.permission === 'default') { cta.hidden = false; cta.className = 'cta soft'; cta.textContent = '💬 רוצה הודעה קופצת גם כשאתה בחלון אחר? לחץ כאן'; }
      else cta.hidden = true;
    }
    document.querySelectorAll('#opps .card[data-g] .st').forEach(el => { const g = S.games.get(+el.closest('.card').dataset.g); if (g && !g.oppOn) el.textContent = statusTxt(g); });
  }
  // three sample cards, clearly marked, so the design can be seen without live deals
  const DEMO = [
    { id: 'demo1', league: 'fl1', home: 'ליון', away: 'ליל', homeAbbr: 'OL', awayAbbr: 'LIL', homeColor: '#1d4ed8', awayColor: '#dc2626', h: 2, a: 0, elapsed: '65', period: '2H', L: [0.94, 250], D: [0.02, 150], N: [0.955, 300] },
    { id: 'demo2', league: 'lal', home: 'ברצלונה', away: 'סביליה', homeAbbr: 'FCB', awayAbbr: 'SEV', homeColor: '#a50044', awayColor: '#e11d48', h: 3, a: 1, elapsed: '72', period: '2H', L: [0.935, 410], D: [0.023, 320], N: [0.962, 500] },
    { id: 'demo3', league: 'ere', home: 'אייאקס', away: 'פיינורד', homeAbbr: 'AJA', awayAbbr: 'FEY', homeColor: '#c8102e', awayColor: '#111827', h: 2, a: 0, elapsed: '81', period: '2H', L: [0.946, 180], D: [0.012, 900], N: [0.951, 260] },
  ];
  const demoGames = () => DEMO.map(d => {
    const top = x => ({ p: x[0], s: x[1], at: Date.now() });
    return Object.assign({}, d, { demo: true, oppOn: true, calc: calcFrom(top(d.L), top(d.D), top(d.N), DEF_FEE, DEF_FEE, DEF_FEE) });
  });
  function render() {
    S.renderPending = false;
    syncSubs();
    const play = [...S.games.values()].filter(isPlay);
    const byMin = (x, y) => minuteOf(y) - minuteOf(x);
    const live = play.filter(shownOpp).sort((x, y) => (y.oppOn - x.oppOn) || (bestOf(y.calc || {}).profit || 0) - (bestOf(x.calc || {}).profit || 0));
    const opps = S.demo ? live.concat(demoGames()) : live;
    const scope = play.filter(g => inScope(g) && !shownOpp(g)).sort((x, y) => ((x.calc && x.calc.ready ? x.calc.sum : 9) - (y.calc && y.calc.ready ? y.calc.sum : 9)) || byMin(x, y));
    const wait = play.filter(waiting).sort(byMin);
    const watch = scope.concat(wait);
    $('kOpp').textContent = live.filter(g => g.oppOn).length;
    $('kWatch').textContent = watch.length;
    $('kLive').textContent = play.length;
    $('gapV').textContent = S.gap;
    $('costV').textContent = S.maxCost + '¢';
    $('minSel').value = String(S.minFrom);
    $('budSel').value = String(S.budget);
    $('summary').textContent = `צריך כ-${shares(Math.ceil(S.budget / (S.maxCost / 100)))} מניות בכל צד`;
    $('headline').innerHTML = `מובילה + תיקו ב-<span dir="ltr">${S.maxCost}¢</span> או פחות? <span class="nw">תקבל התראה מיד.</span>`;
    $('subTx').innerHTML = `הבוט סורק משחקי כדורגל חיים בפער ${S.gap} בדיוק${S.minFrom ? ` מדקה ${S.minFrom}` : ''}, ובודק כמה עולה לקנות יחד "המובילה מנצחת" + "תיקו" — כולל עמלות וכמה מניות זמינות. כשזה זול מספיק — הוא מתריע. <b>שים לב: אם הקבוצה שבפיגור מנצחת, מפסידים את כל הסכום. הבוט רק מתריע, לא קונה ולא מוכר.</b>`;
    $('oppHint').textContent = ruleText();
    $('watchHint').textContent = `משחקים בפער ${S.gap} בדיוק — מהזול ליקר`;
    $('demoBtn').classList.toggle('on', S.demo);
    $('demoBtn').textContent = S.demo ? '🧪 דמו פועל' : '🧪 דמו';
    $('demoBar').hidden = !S.demo;
    const loading = S.snapState !== 'ok' && S.snapState !== 'err' && Date.now() - S.startedAt < WARMUP;
    const sk = '<div class="card sk-card"><div class="sk sk-l" style="width:45%"></div><div class="sk sk-b"></div><div class="sk sk-b"></div><div class="sk sk-p"></div></div>';
    patch($('opps'), opps, cardKey, cardHTML, loading ? sk : `<div class="empty listen"><div class="radar">🧮</div><div><b>אין כרגע הזדמנות</b><br>הבוט בודק כל משחק בפער ${S.gap} בדיוק${S.minFrom ? ` מדקה ${S.minFrom}` : ''}. ברגע שמובילה + תיקו ירדו ל-${S.maxCost}¢ — תשמע צפצוף ותקבל הודעה.</div></div>`);
    patch($('watch'), watch, rowKey, rowHTML, `<div class="empty">${loading ? 'טוען משחקים…' : `אין כרגע משחק בפער ${S.gap} בדיוק`}</div>`);
    for (const g of live.concat(watch)) paint(g);
    const lb = $('logBtn'), lbox = $('log');
    lb.hidden = !S.alerts.length;
    lb.textContent = S.showLog ? '▴ הסתר היסטוריה' : `היסטוריית הזדמנויות (${S.alerts.length}) ▾`;
    lbox.hidden = !S.showLog || !S.alerts.length;
    if (!lbox.hidden) lbox.innerHTML = S.alerts.slice(0, 15).map(a => `<div>${hhmm(a.t)} · <bdi>${esc(a.text)}</bdi></div>`).join('');
    renderTools();
  }
  function scheduleRender() { if (S.renderPending) return; S.renderPending = true; setTimeout(render, 250); }
  S.render = render;
  S.calcFrom = calcFrom;

  /* ---------- wiring ---------- */
  $('gMinus').onclick = () => setGap(S.gap - 1);
  $('gPlus').onclick = () => setGap(S.gap + 1);
  $('cMinus').onclick = () => setCost(S.maxCost - 0.5);
  $('cPlus').onclick = () => setCost(S.maxCost + 0.5);
  $('minSel').onchange = e => setMin(e.target.value);
  $('budSel').onchange = e => setBudget(e.target.value);
  $('demoBtn').onclick = () => { S.demo = !S.demo; toast(S.demo ? '🧪 מצב דמו: 3 כרטיסים לדוגמה' : '✅ חזרה לנתונים חיים'); render(); };
  $('cta').onclick = () => enableAll();
  $('snd').onclick = async () => {
    if (!S.soundOn || !audioOk()) return enableAll();
    S.muted = !S.muted; persist();
    if (!S.muted) { await beep(true); toast('🔔 הצליל פועל'); } else toast('🔕 הצליל כבוי — הבאנר וההודעות ממשיכים');
    renderTools();
  };
  $('logBtn').onclick = () => { S.showLog = !S.showLog; render(); };
  document.addEventListener('click', e => { if (e.target.closest && e.target.closest('a.card, a.row, .ab-go')) stopFlash(); }, true);
  document.addEventListener('pointerdown', () => { unlockAudio(); armTrap(); }, true);
  window.addEventListener('focus', stopFlash);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && document.hasFocus()) stopFlash(); });

  const clock = () => { const el = $('clock'); if (el) el.textContent = new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }); };
  clock();
  S.timers.push(setInterval(clock, 1000));
  S.timers.push(setInterval(() => {
    const now = Date.now();
    for (const [id, g] of S.games) {
      const age = now - (g.lastSeen || 0);
      if (isEnded(g) ? age > 3 * 60e3 : age > (g.period === 'HT' ? 45 : 35) * 60e3) S.games.delete(id);
    }
    if (S.ws && S.wsState === 'open' && now - S.lastMsg > 25e3) { try { S.ws.close(); } catch (e) {} }
    if (S.mws && S.mwsState === 'open' && now - S.mLastAny > 30e3) { try { S.mws.close(); } catch (e) {} }
    scheduleRender();
  }, 15e3));
  S.timers.push(setInterval(() => { let moved = false; for (const g of S.games.values()) if (evalOpp(g)) moved = true; if (moved) scheduleRender(); renderTools(); }, 5e3));
  S.timers.push(setInterval(() => { if (S.subs.size) syncBooks(); }, 20e3));

  try { if (!S.audio) S.audio = new (window.AudioContext || window.webkitAudioContext)(); if (S.audio.state === 'running') S.soundOn = true; } catch (e) {}
  render();
  await loadSports();
  connect();
  connectMkt();
  S.snapStart = Date.now();
  snapshot();
  return 'arb v1 started';
})();

</script>
</body>
</html>
