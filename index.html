  const WARMUP = 90e3;
  const PX_FRESH = 20e3;
  const PLAY = new Set(['1H', 'HT', '2H', 'ET', 'ET1', 'ET2', '1ET', '2ET', 'BT', 'ETHT', 'PEN']);

  const OLD = window.__bot2;
  if (OLD && OLD.stop) { try { OLD.stop(); } catch (e) {} }
  const SS_KEY = 'bot2';
  const saved = (() => { try { return JSON.parse(sessionStorage.getItem(SS_KEY) || 'null') || {}; } catch (e) { return {}; } })();
  const fresh = t => Date.now() - t < 6 * 3600e3;

  const S = window.__bot2 = {
    thr: (OLD && OLD.thr) || saved.thr || 2, games: new Map(), soccer: null, leagueName: {},
    alerts: (OLD && OLD.alerts) || (saved.alerts || []).filter(a => a && fresh(a.t)),
    alertedIds: (OLD && OLD.alertedIds) || saved.alertedIds || {},
    ws: null, wsState: 'connecting', lastMsg: 0, backoff: 1000, closedAt: 0,
    mws: null, mwsState: 'idle', mBackoff: 1000, mInit: false, mLastAny: 0, mLast: 0,
    subs: new Set(), px: new Map(), tokGame: new Map(), dirty: new Set(), rafPending: false,
    startedAt: Date.now(), audio: (OLD && OLD.audio) || null, soundOn: !!(OLD && OLD.soundOn), unseen: 0, flashTimer: null,
    timers: [], stopped: false, snapState: 'idle', lastSnap: 0, renderPending: false, trapArmed: false,
  };
  for (const k of Object.keys(S.alertedIds)) if (!fresh(S.alertedIds[k])) delete S.alertedIds[k];
  S.stop = () => {
    S.stopped = true;
    S.timers.forEach(clearInterval);
    if (S.flashTimer) clearInterval(S.flashTimer);
    if (S.mPing) clearInterval(S.mPing);
    if (S.onPop) window.removeEventListener('popstate', S.onPop);
    try { S.ws && S.ws.close(); } catch (e) {}
    try { S.mws && S.mws.close(); } catch (e) {}
  };
  const persist = () => { try { sessionStorage.setItem(SS_KEY, JSON.stringify({ thr: S.thr, alerts: S.alerts.slice(0, 50), alertedIds: S.alertedIds })); } catch (e) {} };

  /* ---------- page ---------- */
  const CSS = `

html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Assistant,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}

@keyframes tup{0%{background:#bbf7d0}100%{background:transparent}}

.go:hover{filter:brightness(1.08)}

`;
  const HTML = `<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>${BASE_TITLE}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap"><style>${CSS}</style></head>
<body><div class="wrap">
<header class="top"><div><h1>⚽ בוט 2 שערים</h1><p class="sub">מצפצף כשקבוצה מובילה בפער של <b class="thrTxt">2</b>+ שערים · כדורגל חי בפולימרקט</p></div><div class="pills"><div id="status" class="pill">🟡 תוצאות…</div><div id="pstatus" class="pill">🟡 מחירים…</div></div></header>
<section class="bar"><div class="ctrl"><span>התראה מפער של</span><button id="minus" class="round" title="פחות">−</button><b id="thr" class="thr">2</b><button id="plus" class="round" title="יותר">+</button><span>שערים</span></div>
<div class="btns"><button id="test" class="ghost" style="display:none">🔈 בדיקת צליל</button><button id="enable" class="cta">🔔 הפעל צליל והתראות</button></div></section>
<section class="kpis"><div class="kpi"><div class="n" id="kLive">–</div><div class="l">משחקים חיים</div></div><div class="kpi hot"><div class="n" id="kHot">–</div><div class="l">בפער <span class="thrTxt">2</span>+ עכשיו</div></div><div class="kpi"><div class="n" id="kAlerts">0</div><div class="l">התראות מאז שהופעל</div></div></section>
<h2>🔥 פער <span class="thrTxt">2</span>+ עכשיו</h2><section id="hot" class="cards"></section>
<h2>כל המשחקים החיים <a href="https://polymarket.com/sports/soccer/games" target="_blank" rel="noopener">לכל המשחקים בפולימרקט ↗</a></h2><section id="all" class="list"></section>
<h2>📜 התראות אחרונות</h2><section id="log" class="log"></section>
<div class="tip">💡 המחירים מתעדכנים בזמן אמת, כמו בפולימרקט: ירוק = עלה, אדום = ירד. אפשר לרענן — הבוט חוזר לבד.</div>
<footer>הבוט רק מתריע — לא קונה ולא מוכר.<br>התוצאות והמחירים מגיעים מפולימרקט, לפעמים באיחור קטן.<br>כדי שיעבוד: להשאיר את הטאב הזה פתוח ואת המחשב ער.</footer>
</div><div id="toast" class="toast"></div></body>`;
  document.documentElement.innerHTML = HTML;
  document.documentElement.setAttribute('dir', 'rtl');
  document.documentElement.setAttribute('lang', 'he');
  document.title = BASE_TITLE;

  /* ---------- helpers ---------- */
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = x => { const n = parseFloat(x); return isFinite(n) ? n : null; };
  const isEnded = g => !!g.ended || /^(FT|AET|POST|END|FIN)/i.test(g.period || '') || ['Final', 'Awarded', 'Canceled', 'Postponed', 'Abandoned'].includes(g.status);
  const isPlay = g => g.h != null && !isEnded(g) && g.period !== 'SUS' && g.status !== 'Suspended' &&
    (PLAY.has(g.period) || ['InProgress', 'Break', 'PenaltyShootout'].includes(g.status));
  const diffOf = g => Math.abs(g.h - g.a);
  const qual = g => isPlay(g) && diffOf(g) >= S.thr;
  const nm = (g, side) => side === 'h' ? (g.homeAlias || g.home || g.homeName || '?') : (g.awayAlias || g.away || g.awayName || '?');
  const minuteTxt = g => {
    const p = g.period, e = String(g.elapsed == null ? '' : g.elapsed).trim();
    if (p === 'HT') return 'מחצית';
    if (p === 'PEN') return 'פנדלים';
    if (p === 'BT' || p === 'ETHT') return 'הפסקה';
    if (e) return `דקה ${e}'`;
    if (p === '1H') return 'חצי ראשון';
    if (p === '2H') return 'חצי שני';
    if (/ET/.test(p || '')) return 'הארכה';
    return p || '';
  };
  const shortMin = g => {
    const p = g.period, e = String(g.elapsed == null ? '' : g.elapsed).trim();
    if (p === 'HT') return 'מחצית';
    if (p === 'PEN') return 'פנדלים';
    return e ? `${e}'` : (p || '');
  };
  const leagueTxt = g => S.leagueName[g.league] || String(g.league || '').toUpperCase();
  const hhmm = t => new Date(t).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  const link = g => g.slug ? `https://polymarket.com/sports/${g.league}/${g.slug}` : 'https://polymarket.com/sports/soccer/games';
  const getJSON = async url => { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); };
  const fmtC = c => (c >= 99 || c < 1) ? String(Math.min(99.9, Math.max(0.1, Math.round(c * 10) / 10))) : String(Math.round(c));

  function leaderMarket(g) {
    if (!g.mkts || !g.mkts.length || g.h == null || g.h === g.a) return null;
    const leadHome = g.h > g.a;
    const want = (leadHome ? [g.home, g.homeName] : [g.away, g.awayName]).filter(Boolean);
    let m = g.mkts.find(x => want.includes(x.name));
    if (!m) { const nd = g.mkts.filter(x => !/^draw/i.test(x.name)); m = leadHome ? nd[0] : nd[nd.length - 1]; }
    return m || null;
  }
  const pxOf = g => { const m = leaderMarket(g); return m && m.tok ? S.px.get(m.tok) : null; };
  const pxFresh = g => { const p = pxOf(g); return !!(p && Date.now() - p.at < PX_FRESH); };
  function leaderInfo(g) {
    const leadHome = g.h > g.a;
    const leaderName = leadHome ? nm(g, 'h') : nm(g, 'a');
    let cents = null;
    const m = leaderMarket(g);
    if (m) {
      // live order-book ask first (what you'd pay right now), then the slower REST fields
      const p = m.tok ? S.px.get(m.tok) : null;
      const wsAsk = p && Date.now() - p.at < 120e3 ? p.ask : null;
      const polled = m.liveAt && Date.now() - m.liveAt < 120e3 ? m.liveAsk : null;
      const v = [wsAsk, polled, m.ask, m.yes, m.last].find(x => x != null && x > 0 && x < 1);
      if (v != null) cents = v * 100;
    }
    return { leaderName, cents };
  }

  /* ---------- sound / notification / title ---------- */
  const CAN_NOTIFY = ('Notification' in window) && window.isSecureContext && location.origin !== 'null';
  const soundReady = () => { if (S.audio && S.audio.state === 'running' && !S.soundOn) { S.soundOn = true; render(); } };
  function unlockAudio() {
    try {
      if (!S.audio) S.audio = new (window.AudioContext || window.webkitAudioContext)();
      if (S.audio.state === 'suspended') S.audio.resume().then(soundReady).catch(() => {});
      else soundReady();
    } catch (e) {}
  }
  function tones() {
    const ctx = S.audio;
    if (!ctx || ctx.state !== 'running') return false;
    let t = ctx.currentTime + 0.05;
    for (let r = 0; r < 2; r++) {
      for (const f of [784, 1047, 1319]) {
        const o = ctx.createOscillator(), v = ctx.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        v.gain.setValueAtTime(0.0001, t);
        v.gain.exponentialRampToValueAtTime(0.45, t + 0.02);
        v.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.connect(v); v.connect(ctx.destination);
        o.start(t); o.stop(t + 0.25);
        t += 0.18;
      }
      t += 0.35;
    }
    return true;
  }
  async function beep() {
    try {
      unlockAudio();
      if (S.audio && S.audio.state !== 'running') { try { await S.audio.resume(); } catch (e) {} }
      return tones();
    } catch (e) { return false; }
  }
  function notify(g) {
    try {
      if (!CAN_NOTIFY || Notification.permission !== 'granted') return;
      const L = leaderInfo(g);
      const n = new Notification(`⚽ פער ${diffOf(g)}! ${nm(g, 'h')} ${g.h}–${g.a} ${nm(g, 'a')}`, {
        body: `${minuteTxt(g)} · ${leagueTxt(g)}` + (L.cents != null ? ` · ${L.leaderName} לניצחון ≈ ${fmtC(L.cents)}¢` : ''),
        tag: 'bot2-' + g.id, renotify: true, dir: 'rtl', lang: 'he',
      });
      n.onclick = () => { try { window.focus(); } catch (e) {} n.close(); };
    } catch (e) {}
  }
  function flashTitle() {
    if (!document.hidden && document.hasFocus()) return;
    S.unseen++;
    if (S.flashTimer) return;
    let on = false;
    S.flashTimer = setInterval(() => { on = !on; document.title = on ? `🔔 (${S.unseen}) פער ${S.thr}+!` : BASE_TITLE; }, 1000);
  }
  function stopFlash() {
    if (S.flashTimer) { clearInterval(S.flashTimer); S.flashTimer = null; }
    S.unseen = 0; document.title = BASE_TITLE;
  }

  /* ---------- alert logic ---------- */
  function fireAlert(g) {
    g.alerted = true; g.known = false; g.alertAt = Date.now(); g.flashUntil = Date.now() + 90e3;
    S.alertedIds[g.id] = g.alertAt;
    S.alerts.unshift({ t: g.alertAt, id: g.id, text: `${nm(g, 'h')} ${g.h}–${g.a} ${nm(g, 'a')} · ${minuteTxt(g)} · ${leagueTxt(g)}` });
    if (S.alerts.length > 50) S.alerts.length = 50;
    persist();
    beep(); notify(g); flashTitle();
    ensureMeta(g, true);
    scheduleRender();
  }
  function evaluate(g, prevDiff, src) {
    if (!qual(g)) {
      if (g.h == null || diffOf(g) < S.thr) {
        g.alerted = false; g.known = false; g.alertAt = null;
        // only a live (WebSocket) score may cancel an earlier alert — the REST snapshot can lag
        if (src === 'ws' && S.alertedIds[g.id]) { delete S.alertedIds[g.id]; persist(); }
      }
      return;
    }
    if (g.alerted || g.known) return;
    if (S.alertedIds[g.id]) { g.alerted = true; g.alertAt = S.alertedIds[g.id]; return; }
    const warm = Date.now() - S.startedAt < WARMUP;
    const sawLower = prevDiff != null && prevDiff < S.thr;
    if (sawLower || !warm) fireAlert(g); else g.known = true;
  }
  function setThr(v) {
    v = Math.max(1, Math.min(5, v));
    if (v === S.thr) return;
    S.thr = v;
    for (const g of S.games.values()) {
      if (qual(g)) { if (!g.alerted) g.known = true; }
      else { g.alerted = false; g.known = false; g.alertAt = null; delete S.alertedIds[g.id]; }
    }
    persist();
    render();
  }
  function toast(msg) {
    const t = $('toast'); if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(S.toastT); S.toastT = setTimeout(() => t.classList.remove('show'), 3500);
  }
  // one accidental "back" (e.g. a trackpad swipe) won't close the bot
  function armTrap() {
    if (S.trapArmed) return; S.trapArmed = true;
    try { history.pushState({ bot2: 1 }, '', location.href); } catch (e) {}
  }
  S.onPop = () => { try { history.pushState({ bot2: 1 }, '', location.href); } catch (e) {} toast('🙂 הבוט נשאר פה. כדי לסגור אותו — סוגרים את הטאב'); };
  window.addEventListener('popstate', S.onPop);

  /* ---------- game data (Gamma REST) ---------- */
  function teamsFromTitle(title) { const p = String(title || '').split(/\s+vs\.?\s+/i); return p.length === 2 ? p.map(s => s.trim()) : [null, null]; }
  function applyEvent(g, e) {
    if (e.slug) g.slug = e.slug;
    if (!g.league && e.slug) g.league = e.slug.split('-')[0];
    const [hn, an] = teamsFromTitle(e.title);
    if (hn) { g.homeName = hn; g.awayName = an; }
    if (!g.home) g.home = hn;
    if (!g.away) g.away = an;
    for (const t of (e.teams || [])) {
      if (!t || !t.name) continue;
      if (t.name === g.home || t.name === hn) g.homeAlias = t.alias || null;
      if (t.name === g.away || t.name === an) g.awayAlias = t.alias || null;
    }
    const mk = (e.markets || []).filter(m => !m.sportsMarketType || /moneyline/i.test(m.sportsMarketType));
    const prev = {};
    for (const m of (g.mkts || [])) if (m.tok) prev[m.tok] = m;
    g.mkts = mk.map(m => {
      let yes = null, tok = null;
      try { yes = num(JSON.parse(m.outcomePrices || '[]')[0]); } catch (x) {}
      try { tok = JSON.parse(m.clobTokenIds || '[]')[0] || null; } catch (x) {}
      const o = { name: m.groupItemTitle || '', ask: num(m.bestAsk), yes, last: num(m.lastTradePrice), tok };
      const p = tok && prev[tok];
      if (p && p.liveAt) { o.liveAsk = p.liveAsk; o.liveBid = p.liveBid; o.liveAt = p.liveAt; }
      return o;
    });
  }
  // light lookup of a game's main event (≈20 KB) to learn its markets and order-book tokens
  async function ensureMeta(g, force) {
    if (g.metaLoading) return;
    if (g.mkts && g.mkts.some(m => m.tok)) return;
    if (!force && g.metaTried && Date.now() - g.metaTried < 60e3) return;
    g.metaLoading = true; g.metaTried = Date.now();
    try {
      let e = null;
      if (g.slug) { const a = await getJSON(`${GAMMA}/events?slug=${encodeURIComponent(g.slug)}`); e = a && a[0]; }
      if (!e) { const a = await getJSON(`${GAMMA}/events?game_id=${g.id}&limit=1&order=id&ascending=true`); e = a && a[0]; if (e && !MAIN_RE.test(e.slug || '')) e = null; }
      if (!e) {
        const a = (await getJSON(`${GAMMA}/events?game_id=${g.id}`)) || [];
        const mains = a.filter(x => MAIN_RE.test(x.slug || ''));
        e = (mains.length ? mains : a).slice().sort((x, y) => (x.slug || '').length - (y.slug || '').length)[0];
      }
      if (e) applyEvent(g, e);
    } catch (x) {}
    g.metaLoading = false;
    scheduleRender();
  }
  // fallback when the live price stream is quiet: read the order book directly
  async function pollBook(g) {
    if (g.polling || pxFresh(g)) return;
    if (g.polledAt && Date.now() - g.polledAt < 25e3) return;
    const m = leaderMarket(g);
    if (!m || !m.tok) return;
    g.polling = true;
    try {
      const b = await getJSON(`${CLOB}/book?token_id=${encodeURIComponent(m.tok)}`);
      m.liveAsk = bestOf(b.asks, false); m.liveBid = bestOf(b.bids, true); m.liveAt = Date.now();
      markDirty(g.id);
    } catch (x) {}
    g.polledAt = Date.now(); g.polling = false;
  }
  async function loadSports() {
    try {
      const sp = await getJSON(`${GAMMA}/sports`);
      const set = new Set();
      for (const s of sp) {
        const code = String(s.sport || '').toLowerCase();
        if (!code) continue;
        S.leagueName[code] = s.name;
        if (String(s.tags || '').split(',').includes('100350')) set.add(code);
      }
      if (set.size) S.soccer = set;
    } catch (e) { S.sportsErr = String(e); }
  }
  async function snapshot() {
    S.snapState = 'loading';
    try {
      const base = `${GAMMA}/events?tag_id=100350&closed=false&live=true&order=startTime&ascending=false&limit=100`;
      const pages = await Promise.all([0, 100, 200].map(off => getJSON(base + '&offset=' + off).catch(() => [])));
      let all = pages.flat();
      for (let off = 300; pages[pages.length - 1].length === 100 && off < 600; off += 100) {
        const arr = await getJSON(base + '&offset=' + off).catch(() => []);
        pages.push(arr); all = all.concat(arr);
      }
      const now = Date.now();
      for (const e of all) {
        if (!MAIN_RE.test(e.slug || '') || e.gameId == null || !PLAY.has(e.period)) continue;
        const sc = /^(\d+)-(\d+)$/.exec(String(e.score || '').trim());
        if (!sc) continue;
        let g = S.games.get(e.gameId);
        const isNew = !g;
        if (!g) { g = { id: e.gameId, firstSeen: now }; S.games.set(e.gameId, g); }
        g.league = (e.slug.split('-')[0] || '').toLowerCase();
        applyEvent(g, e);
        if (isNew || !g.wsAt || g.wsAt < S.snapStart) {
          const prev = g.h != null ? diffOf(g) : null;
          g.h = +sc[1]; g.a = +sc[2]; g.period = e.period; g.elapsed = e.elapsed; g.live = e.live; g.ended = e.ended; g.lastSeen = now;
          evaluate(g, prev, 'snap');
        }
      }
      S.snapState = 'ok'; S.lastSnap = now; S.snapCount = all.length;
    } catch (x) { S.snapState = 'err'; S.snapErr = String(x); }
    scheduleRender();
  }

  /* ---------- live scores (Sports WebSocket) ---------- */
  function onGame(m) {
    if (!m || m.gameId == null) return;
    const lg = String(m.leagueAbbreviation || '').toLowerCase();
    if (S.soccer ? !S.soccer.has(lg) : !PLAY.has(m.period)) return;
    const sc = /^(\d+)-(\d+)$/.exec(String(m.score || '').trim());
    let g = S.games.get(m.gameId);
    if (!g) { if (!sc) return; g = { id: m.gameId, firstSeen: Date.now() }; S.games.set(m.gameId, g); }
    const prev = g.h != null ? diffOf(g) : null;
    if (m.homeTeam) g.home = m.homeTeam;
    if (m.awayTeam) g.away = m.awayTeam;
    for (const k of ['status', 'period', 'elapsed', 'live', 'ended']) if (m[k] !== undefined && m[k] !== null) g[k] = m[k];
    if (m.slug && MAIN_RE.test(m.slug)) g.slug = m.slug;
    if (sc) { g.h = +sc[1]; g.a = +sc[2]; }
    g.league = lg; g.lastSeen = g.wsAt = Date.now();
    evaluate(g, prev, 'ws');
    if (g.h !== g.a && isPlay(g)) ensureMeta(g); // a team leads → get its market so prices stream before a 2nd goal
    scheduleRender();
  }
  S.onGame = onGame;

  function connect() {
    if (S.stopped) return;
    S.wsState = 'connecting'; renderStatus();
    let ws;
    try { ws = new WebSocket(WS_URL); } catch (e) { S.wsState = 'closed'; return setTimeout(connect, 5000); }
    S.ws = ws;
    ws.onopen = () => {
      S.wsState = 'open'; S.lastMsg = Date.now(); S.backoff = 1000; renderStatus();
      if (S.closedAt && Date.now() - S.closedAt > 60e3 && Date.now() - S.lastSnap > 10 * 60e3) { S.snapStart = Date.now(); snapshot(); }
      S.closedAt = 0;
    };
    ws.onmessage = ev => {
      S.lastMsg = Date.now();
      if (ev.data === 'ping') { if (ws.readyState === 1) ws.send('pong'); return; }
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      (Array.isArray(m) ? m : [m]).forEach(onGame);
    };
    ws.onclose = () => {
      if (S.ws !== ws) return;
      S.wsState = 'closed'; if (!S.closedAt) S.closedAt = Date.now(); renderStatus();
      if (!S.stopped) setTimeout(connect, S.backoff = Math.min(S.backoff * 2, 30e3));
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  /* ---------- live prices (CLOB market WebSocket) ---------- */
  function bestOf(levels, highest) {
    let b = null;
    for (const x of (levels || [])) {
      const p = +x.price;
      if (!isFinite(p) || !(+x.size > 0)) continue;
      b = b == null ? p : (highest ? Math.max(b, p) : Math.min(b, p));
    }
    return b;
  }
  function setPx(tok, bid, ask, full) {
    const gid = S.tokGame.get(tok);
    if (gid == null) return;
    let p = S.px.get(tok);
    if (!p) { p = {}; S.px.set(tok, p); }
    if (full) { p.bid = bid; p.ask = ask; } else { if (bid != null) p.bid = bid; if (ask != null) p.ask = ask; }
    p.at = S.mLast = Date.now();
    markDirty(gid);
  }
  function onMkt(x) {
    if (!x) return;
    switch (x.event_type) {
      case 'book': setPx(x.asset_id, bestOf(x.bids, true), bestOf(x.asks, false), true); break;
      case 'best_bid_ask': setPx(x.asset_id, num(x.best_bid), num(x.best_ask)); break;
      case 'price_change': for (const c of (x.price_changes || [])) if (S.tokGame.has(c.asset_id)) setPx(c.asset_id, num(c.best_bid), num(c.best_ask)); break;
      case 'last_trade_price': { const p = S.px.get(x.asset_id); if (p) p.last = num(x.price); break; }
    }
  }
  function mktSend(o) { const ws = S.mws; if (ws && ws.readyState === 1) { ws.send(JSON.stringify(o)); return true; } return false; }
  function subscribe(toks) {
    const add = toks.filter(t => t && !S.subs.has(t));
    if (!add.length) return;
    add.forEach(t => S.subs.add(t));
    if (!S.mws || S.mws.readyState !== 1) return; // sent on (re)connect
    if (!S.mInit) S.mInit = mktSend({ assets_ids: [...S.subs], type: 'market', custom_feature_enabled: true });
    else mktSend({ assets_ids: add, operation: 'subscribe' });
  }
  function unsubscribe(toks) {
    const rm = toks.filter(t => S.subs.has(t));
    if (!rm.length) return;
    rm.forEach(t => { S.subs.delete(t); S.px.delete(t); });
    if (S.mInit) mktSend({ assets_ids: rm, operation: 'unsubscribe' });
  }
  // stream the leading team's price for every live game where someone leads
  function syncSubs() {
    const want = new Set();
    for (const g of S.games.values()) {
      if (!isPlay(g) || g.h === g.a) continue;
      if (!g.mkts || !g.mkts.some(m => m.tok)) { ensureMeta(g); continue; }
      const m = leaderMarket(g);
      if (m && m.tok) { want.add(m.tok); S.tokGame.set(m.tok, g.id); }
    }
    subscribe([...want]);
    unsubscribe([...S.subs].filter(t => !want.has(t)));
  }
  function connectMkt() {
    if (S.stopped) return;
    S.mwsState = 'connecting'; S.mInit = false;
    let ws;
    try { ws = new WebSocket(MKT_WS); } catch (e) { S.mwsState = 'closed'; return setTimeout(connectMkt, 5000); }
    S.mws = ws;
    ws.onopen = () => {
      S.mwsState = 'open'; S.mBackoff = 1000; S.mLastAny = Date.now();
      if (S.subs.size) S.mInit = mktSend({ assets_ids: [...S.subs], type: 'market', custom_feature_enabled: true });
      if (S.mPing) clearInterval(S.mPing);
      S.mPing = setInterval(() => { if (ws.readyState === 1) ws.send('PING'); }, 10e3);
      renderStatus();
    };
    ws.onmessage = ev => {
      S.mLastAny = Date.now();
      if (ev.data === 'PONG') return;
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (Array.isArray(m)) m.forEach(onMkt); else onMkt(m);
    };
    ws.onclose = () => {
      if (S.mws !== ws) return;
      S.mwsState = 'closed'; S.mInit = false; renderStatus();
      if (!S.stopped) setTimeout(connectMkt, S.mBackoff = Math.min(S.mBackoff * 2, 30e3));
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  /* ---------- fast price painting (no full re-render) ---------- */
  function markDirty(id) {
    S.dirty.add(id);
    if (!S.rafPending) { S.rafPending = true; requestAnimationFrame(flushDirty); }
  }
  function flushDirty() {
    S.rafPending = false;
    for (const id of S.dirty) { const g = S.games.get(id); if (g) paintPrice(g); }
    S.dirty.clear();
  }
  function tick(el, dir) {
    if (!el || !dir) return;
    el.classList.remove('tick-up', 'tick-dn');
    void el.offsetWidth;
    el.classList.add(dir > 0 ? 'tick-up' : 'tick-dn');
  }
  function paintPrice(g) {
    const L = leaderInfo(g);
    if (L.cents == null) return;
    const txt = fmtC(L.cents) + '¢';
    const dir = g.shownC == null ? 0 : (L.cents > g.shownC + 0.05 ? 1 : L.cents < g.shownC - 0.05 ? -1 : 0);
    const card = document.querySelector(`.card[data-g="${g.id}"]`);
    if (card) {
      const pv = card.querySelector('.pv');
      if (!pv) { scheduleRender(); }
      else if (pv.textContent !== txt) {
        pv.textContent = txt;
        const up = card.querySelector('.math .up'), dn = card.querySelector('.math .dn');
        if (up) up.textContent = '+' + fmtC(100 - L.cents) + '¢';
        if (dn) dn.textContent = '−' + txt;
        tick(pv, dir); tick(card.querySelector('.math'), dir);
      }
      const dot = card.querySelector('.live');
      if (dot) dot.classList.toggle('on', pxFresh(g));
    }
    const chip = document.querySelector(`.row[data-g="${g.id}"] .pc`);
    if (chip && chip.textContent !== txt) { chip.textContent = txt; tick(chip, dir); }
    g.shownC = L.cents;
  }

  /* ---------- render ---------- */
  function cardHTML(g) {
    const L = leaderInfo(g), leadHome = g.h > g.a;
    const flash = g.flashUntil && Date.now() < g.flashUntil;
    let price = `<div class="price">💰 טוען מחיר…</div>`;
    if (L.cents != null) {
      const c = fmtC(L.cents), up = fmtC(100 - L.cents);
      price = `<div class="price">💰 מחיר לניצחון של המובילה: <b class="pv">${c}¢</b><span class="live${pxFresh(g) ? ' on' : ''}"></span><span class="livetx">חי</span></div>` +
        `<div class="math">אם מנצחת: <b class="up">+${up}¢</b> · אם לא: <b class="dn">−${c}¢</b> (לכל מניה)</div>`;
      g.shownC = L.cents;
    } else if (g.metaTried && !g.metaLoading && !g.mkts) price = '';
    const when = g.alertAt ? `🔔 התראה ב-${hhmm(g.alertAt)}` : 'היה בפער מההתחלה';
    const tr = (side, goals, lead) => `<div class="tr${lead ? ' lead' : ''}"><span class="nm">${esc(nm(g, side))}</span><span class="gl">${goals}</span></div>`;
    return `<div class="card${flash ? ' flash' : ''}" data-g="${g.id}"><div class="meta"><span>${esc(leagueTxt(g))}</span><span class="min">${esc(minuteTxt(g))}</span></div>` +
      `<div class="board">${tr('h', g.h, leadHome)}${tr('a', g.a, !leadHome)}</div>` +
      `${price}<div class="foot"><span>${when}</span><a class="go" href="${esc(link(g))}" target="_blank" rel="noopener">פתח בפולימרקט ↗</a></div></div>`;
  }
  function rowHTML(g) {
    const q = qual(g), leadHome = g.h > g.a, lead = g.h !== g.a;
    const cls = side => !lead ? '' : ((side === 'h') === leadHome ? (q ? 'lead' : 'ld') : '');
    const L = lead ? leaderInfo(g) : { cents: null };
    const chip = L.cents != null ? fmtC(L.cents) + '¢' : '';
    return `<div class="row${q ? ' q' : ''}" data-g="${g.id}"><span class="min">${esc(shortMin(g))}</span>` +
      `<span class="teams"><span class="${cls('h')}">${esc(nm(g, 'h'))}</span><b>${g.h}–${g.a}</b><span class="${cls('a')}">${esc(nm(g, 'a'))}</span></span>` +
      `<span class="pc" title="מחיר לניצחון של הקבוצה המובילה">${chip}</span><span class="lg">${esc(leagueTxt(g))}</span></div>`;
  }
  function renderStatus() {
    const el = $('status'), pe = $('pstatus');
    if (el) {
      const age = Date.now() - S.lastMsg;
      if (S.wsState === 'open' && age < 20e3) el.textContent = '🟢 תוצאות חיות';
      else if (S.wsState === 'closed') el.textContent = '🔴 תוצאות · מתחבר מחדש…';
      else el.textContent = '🟡 תוצאות…';
    }
    if (pe) {
      if (S.mwsState === 'open' && Date.now() - S.mLastAny < 25e3) pe.textContent = '🟢 מחירים חיים';
      else if (S.mwsState === 'closed') pe.textContent = '🟡 מחירים · כל 30 שניות';
      else pe.textContent = '🟡 מחירים…';
    }
    document.querySelectorAll('.card[data-g]').forEach(c => {
      const g = S.games.get(+c.dataset.g), dot = c.querySelector('.live');
      if (g && dot) dot.classList.toggle('on', pxFresh(g));
    });
  }
  function renderEnable() {
    const b = $('enable'), t = $('test');
    if (!S.soundOn) { b.className = 'cta'; b.textContent = CAN_NOTIFY ? '🔔 הפעל צליל והתראות' : '🔔 לחץ להפעלת צליל'; t.style.display = 'none'; return; }
    const np = CAN_NOTIFY ? Notification.permission : 'na';
    if (np === 'default') { b.className = 'cta'; b.textContent = '🔔 הפעל גם הודעות קופצות'; t.style.display = ''; return; }
    b.className = 'cta on';
    b.textContent = np === 'granted' ? '✅ צליל + התראות פעילים' : np === 'denied' ? '✅ צליל פעיל · התראות חסומות' : '✅ צליל פעיל';
    t.style.display = '';
  }
  function render() {
    S.renderPending = false;
    syncSubs();
    const play = [...S.games.values()].filter(isPlay);
    const hot = play.filter(qual).sort((x, y) => (y.alertAt || 0) - (x.alertAt || 0) || diffOf(y) - diffOf(x));
    $('kLive').textContent = play.length;
    $('kHot').textContent = hot.length;
    $('kAlerts').textContent = S.alerts.length;
    $('thr').textContent = S.thr;
    document.querySelectorAll('.thrTxt').forEach(el => { el.textContent = S.thr; });
    $('hot').innerHTML = hot.length ? hot.map(cardHTML).join('') : `<div class="empty">אין כרגע משחק בפער ${S.thr}+ · הבוט מקשיב 👂</div>`;
    const rows = play.slice().sort((x, y) => (qual(y) - qual(x)) || (diffOf(y) - diffOf(x)) || ((parseInt(y.elapsed, 10) || 0) - (parseInt(x.elapsed, 10) || 0)));
    const warming = Date.now() - S.startedAt < WARMUP || S.snapState === 'loading';
    $('all').innerHTML = rows.length ? rows.map(rowHTML).join('') : `<div class="empty">${warming ? 'אוסף משחקים חיים… (עד דקה)' : 'אין כרגע משחקי כדורגל חיים'}</div>`;
    $('log').innerHTML = S.alerts.length
      ? S.alerts.slice(0, 12).map(a => `<div>${hhmm(a.t)} · <bdi>${esc(a.text)}</bdi></div>`).join('')
      : '<div style="color:var(--mut)">עוד אין התראות</div>';
    renderStatus(); renderEnable();
  }
  function scheduleRender() { if (S.renderPending) return; S.renderPending = true; setTimeout(render, 300); }
  S.render = render;

  /* ---------- wiring ---------- */
  $('minus').onclick = () => setThr(S.thr - 1);
  $('plus').onclick = () => setThr(S.thr + 1);
  $('enable').onclick = async () => {
    S.soundOn = true; render();
    await beep();
    if (CAN_NOTIFY && Notification.permission === 'default') { try { await Notification.requestPermission(); } catch (e) {} }
    render();
  };
  $('test').onclick = () => { beep(); };
  document.addEventListener('pointerdown', () => { unlockAudio(); armTrap(); }, true);
  window.addEventListener('focus', stopFlash);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && document.hasFocus()) stopFlash(); });

  S.timers.push(setInterval(() => {
    const now = Date.now();
    for (const [id, g] of S.games) {
      const age = now - (g.lastSeen || 0);
      if (isEnded(g) ? age > 3 * 60e3 : age > (g.period === 'HT' ? 45 : 35) * 60e3) S.games.delete(id);
    }
    for (const g of S.games.values()) if (qual(g)) pollBook(g);
    if (S.ws && S.wsState === 'open' && now - S.lastMsg > 25e3) { try { S.ws.close(); } catch (e) {} }
    if (S.mws && S.mwsState === 'open' && now - S.mLastAny > 30e3) { try { S.mws.close(); } catch (e) {} }
    scheduleRender();
  }, 15e3));
  S.timers.push(setInterval(renderStatus, 5e3));

  try { if (!S.audio) S.audio = new (window.AudioContext || window.webkitAudioContext)(); if (S.audio.state === 'running') S.soundOn = true; } catch (e) {}
  render();
  await loadSports();
  connect();
  connectMkt();
  S.snapStart = Date.now();
  snapshot();
  return 'bot2 started';
})();

</script>
</body>
</html>
